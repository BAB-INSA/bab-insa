name: Deploy

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment'
                required: true
                default: 'production'
                type: choice
                options:
                    - production
                    - staging

jobs:
    deploy-backend:
        name: Deploy Backend
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        env:
            DEPLOY_ENV: ${{ inputs.environment }}
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'

            - name: Install PHP dependencies
              run: APP_ENV=prod composer install --no-dev --optimize-autoloader

            - name: Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

            - name: Prepare robots.txt
              run: cp public/robots.${{ env.DEPLOY_ENV }}.txt public/robots.txt

            - name: Deploy
              run: |
                  eval $(ssh-agent -s)
                  ssh-add ~/.ssh/id_ed25519
                  rsync -azv --delete \
                    -e "ssh -p ${{ secrets.SSH_PORT }}" \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='var/' \
                    --exclude='.env.local' \
                    --exclude='config/jwt/' \
                    ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.BACKEND_PATH }}/
                  ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
                    "cd ${{ secrets.BACKEND_PATH }} && php bin/console cache:clear"

    deploy-frontend:
        name: Deploy Frontend
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        env:
            DEPLOY_ENV: ${{ inputs.environment }}
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build-${{ env.DEPLOY_ENV }}

            - name: Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy
              run: |
                  eval $(ssh-agent -s)
                  ssh-add ~/.ssh/id_ed25519
                  rsync -rav --quiet --delete \
                    -e "ssh -p ${{ secrets.SSH_PORT }}" \
                    dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.FRONTEND_PATH }}/